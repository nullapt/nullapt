version: 2

project_name: nullapt

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: nullapt
    main: ./cmd/nullapt
    binary: nullapt
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: nullapt
    builds: [nullapt]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch
  groups:
    - title: "New features"
      regexp: "^feat"
    - title: "Bug fixes"
      regexp: "^fix"
    - title: "Other"
      order: 999

brews:
  - name: nullapt
    repository:
      owner: nullapt
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://nullapt.dev
    description: "The private-first package manager for AI skills"
    license: MIT
    test: |
      system "#{bin}/nullapt --version"
    install: |
      bin.install "nullapt"

release:
  github:
    owner: nullapt
    name: nullapt
  draft: false
  prerelease: auto
  name_template: "{{.ProjectName}} {{.Version}}"
  header: |
    ## ~/nullapt {{.Version}}

    Install or upgrade:
    ```bash
    brew upgrade nullapt
    # or
    curl -fsSL https://nullapt.dev/install.sh | sh
    ```
