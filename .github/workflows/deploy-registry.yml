name: Deploy Registry API

on:
  push:
    branches: [main]
    paths:
      - "cmd/registry-api/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy registry API
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://registry.nullapt.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Apply database migrations
        run: psql "${{ secrets.DATABASE_URL }}" -f internal/db/schema.sql

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service registry-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
