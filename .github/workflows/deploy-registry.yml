name: Deploy Registry API

on:
  push:
    branches: [main]
    paths:
      - "cmd/registry-api/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/deploy-registry.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build & deploy registry API
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://registry.nullapt.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o registry-api ./cmd/registry-api

      - name: Apply database migrations
        run: |
          psql ${{ secrets.DATABASE_URL }} -f internal/db/schema.sql
        env:
          PGPASSWORD: ${{ secrets.DB_PASSWORD }}

      # Swap this step for your preferred deployment target:
      # Railway, Fly.io, Cloud Run, a plain VPS with rsync, etc.
      - name: Deploy to Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
