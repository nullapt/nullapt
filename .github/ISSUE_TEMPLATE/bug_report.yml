name: Bug Report
description: Something isn't working correctly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report. Please fill out as much as you can.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of NullApt is affected?
      options:
        - CLI (nullapt)
        - Registry API
        - Web Marketplace
        - SKILL.json parsing / validation
        - Signature verification
        - WASM sandbox / runtime
        - MCP bridge
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NullApt version
      description: Run `nullapt --version` and paste the output
      placeholder: "v0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.4 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The exact commands or actions to trigger the bug.
      placeholder: |
        1. nullapt get some-skill
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste error output here.
      render: shell

  - type: textarea
    id: skill_json
    attributes:
      label: SKILL.json (if relevant)
      description: Paste the manifest that triggered the issue, with the signature value redacted.
      render: json

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues before filing this one
          required: true
        - label: I am using the latest version of nullapt
